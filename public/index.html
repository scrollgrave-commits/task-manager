<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1017" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">Task Manager</p>
      <div class="header-row">
        <h1>My Tasks</h1>
        <p class="progress-label"><span id="progress-label">0 of 0 done</span></p>
      </div>
      <p class="date-line" id="date-line"></p>
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
    </header>

    <form id="add-form" class="add-form" novalidate>
      <div class="add-inputs">
        <input id="new-title" type="text" placeholder="What needs to be done?" maxlength="200" required />
        <input id="new-description" type="text" placeholder="Add a note (optional)" maxlength="1000" />
      </div>
      <button id="add-button" type="submit" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add task</span>
      </button>
      <p id="form-error" class="form-error" role="alert" hidden></p>
    </form>

    <nav class="filters" aria-label="Task filters">
      <button class="filter active" data-status="all">All <span class="count" id="count-all">0</span></button>
      <button class="filter" data-status="active">Active <span class="count" id="count-active">0</span></button>
      <button class="filter" data-status="completed">Completed <span class="count" id="count-completed">0</span></button>
    </nav>

    <section id="task-list" class="task-list" aria-live="polite"></section>

    <div id="empty-state" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8"/></svg>
      <p class="empty-title">All clear</p>
      <p class="empty-sub">Add your first task above to get started.</p>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>

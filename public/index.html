<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Deck - Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-text">
        <span class="eyebrow">task manager</span>
        <h1>The Deck</h1>
        <p class="date" id="today"></p>
      </div>
      <div class="progress" title="Deck progress">
        <svg viewBox="0 0 44 44" class="ring" aria-hidden="true">
          <circle class="ring-track" cx="22" cy="22" r="19" />
          <circle class="ring-fill" id="ring-fill" cx="22" cy="22" r="19" />
        </svg>
        <span class="progress-label" id="progress-label">0 of 0</span>
      </div>
    </header>

    <main>
      <!-- Deck view: the top card is your current focus -->
      <section id="deck-view" aria-label="Task deck">
        <div class="deck-stage">
          <div id="deck" aria-live="polite"></div>
          <div id="deck-empty" class="deck-empty" hidden>
            <div class="deck-empty-card">
              <span class="deck-empty-mark" aria-hidden="true">✓</span>
              <p class="deck-empty-title" id="deck-empty-title">Deck cleared</p>
              <p class="deck-empty-sub" id="deck-empty-sub">Every card is done. Deal a new one below.</p>
            </div>
          </div>
        </div>
        <div class="deck-controls" id="deck-controls">
          <button type="button" id="later-button" class="btn-later" title="Send this card to the back of the deck">
            <span aria-hidden="true">↺</span> Later
          </button>
          <p class="deck-hint">drag right to finish · left to send back</p>
          <button type="button" id="done-button" class="btn-done" title="Complete this card">
            <span aria-hidden="true">✓</span> Done
          </button>
        </div>
      </section>

      <!-- Spread view: full management list -->
      <section id="spread-view" aria-label="All tasks" hidden>
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button type="button" class="filter is-active" data-filter="all" role="tab" aria-selected="true">All <span class="count" id="count-all">0</span></button>
          <button type="button" class="filter" data-filter="active" role="tab" aria-selected="false">Active <span class="count" id="count-active">0</span></button>
          <button type="button" class="filter" data-filter="completed" role="tab" aria-selected="false">Completed <span class="count" id="count-completed">0</span></button>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p id="list-empty" class="list-empty" hidden>No tasks here yet.</p>
      </section>
    </main>

    <button type="button" id="view-toggle" class="view-toggle" aria-pressed="false">
      <span id="view-toggle-label">Spread view</span>
    </button>

    <!-- Deal a new card -->
    <form id="add-form" class="add-form" novalidate>
      <div class="add-slip">
        <div class="add-inputs">
          <input id="new-title" type="text" placeholder="Write a new card..." autocomplete="off" maxlength="200" aria-label="Task title" />
          <input id="new-note" type="text" placeholder="Add a note (optional)" autocomplete="off" maxlength="500" aria-label="Task note" />
        </div>
        <button type="submit" id="add-button"><span aria-hidden="true">＋</span> Deal card</button>
      </div>
      <p id="form-error" class="form-error" hidden></p>
    </form>
  </div>

  <div id="toast" class="toast" hidden>
    <span class="toast-dot" aria-hidden="true"></span>
    <span id="toast-message"></span>
    <button type="button" id="toast-action" class="toast-action" hidden>Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
